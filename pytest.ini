[pytest]
# 让 pytest 把项目根目录加进 sys.path，这样测试里可以直接
# `from scraper.cleaner import parse_price`，不需要装包或配 PYTHONPATH。
# 没有这行的话，从项目根跑 pytest 会报 ModuleNotFoundError。
pythonpath = .

testpaths = tests

# 默认静默输出。加 -v 或者在命令行里覆盖可以看详细过程。
addopts = -q --tb=short

# 测试文件命名约定
python_files = test_*.py
python_functions = test_*
