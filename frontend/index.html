<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商竞品情报分析平台 · 总览</title>
<link rel="stylesheet" href="static/css/style.css">

<!-- ECharts 5.6.0 + 本地兜底。版本不能动：
     5.5.1 在 bootcdn / staticfile 上是 404；6.x 与 echarts-wordcloud 2.1.0（兼容声明 ^5.0.1）不兼容。
     兜底用 document.write 而不是 appendChild：动态插入的 <script> 是异步的，后面的脚本会先跑，
     而 document.write 在解析期同步插入，能保证顺序。 -->
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<script>
  window.echarts || document.write('<script src="vendor/echarts.min.js"><\/script>');
</script>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts-wordcloud/2.1.0/echarts-wordcloud.min.js"></script>
<script>
  // 插件 UMD 包装把自己挂在 window['echarts-wordcloud'] 上，用它判断加载是否成功。
  window['echarts-wordcloud'] ||
    document.write('<script src="vendor/echarts-wordcloud.min.js"><\/script>');
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">电商竞品情报分析<span>数据管道演示</span></div>
    <!-- 数据源切换由 JS 填充：计数要从接口拿，不能写死在 HTML 里 -->
    <div class="switcher" id="source-switcher" role="group" aria-label="数据源"></div>
    <nav class="pages">
      <a href="index.html" class="active">总览</a>
      <a href="products.html">商品列表</a>
      <a href="analysis.html">AI 分析</a>
      <a href="alerts.html">价格告警</a>
    </nav>
  </div>
</header>

<main>
  <!-- 总览卡片 -->
  <section class="cards" id="cards"></section>

  <!-- 全局提示条：承载"这个数据源整体上缺了什么"（单张图的缺失由图内提示负责）。 -->
  <div class="notice" id="global-notice"></div>

  <section class="charts">

    <div class="panel">
      <h2>价格分布</h2>
      <div class="hint">每个商品按其<b>当前价</b>计入一个价格区间（不是历史价，历史价要看详情页）</div>
      <div class="notice" id="notice-price"></div>
      <div class="chart" id="chart-price"></div>
      <div class="empty-state" id="empty-price"></div>
    </div>

    <div class="panel">
      <h2>店铺占比</h2>
      <div class="hint">按商品数统计；未采集到店铺信息的商品归入「未知店铺」，不计入丢失</div>
      <div class="notice" id="notice-shop"></div>
      <div class="chart" id="chart-shop"></div>
      <div class="empty-state" id="empty-shop"></div>
    </div>

    <div class="panel">
      <h2>销量 Top 20</h2>
      <div class="hint">柱状图标签经过截断，<b>鼠标悬停可看完整标题</b>（长标题尾部常是营销语，截断无法保证区分 SKU）</div>
      <div class="notice" id="notice-sales"></div>
      <div class="chart tall" id="chart-sales"></div>
      <div class="empty-state" id="empty-sales"></div>
    </div>

    <div class="panel">
      <h2>标题关键词</h2>
      <div class="hint">jieba 分词 + 自定义词典 + 停用词过滤；ASCII 词保留长度 ≥3 的（USB / Type-C / iPhone 这类是数码品类信息量最高的词）</div>
      <div class="notice" id="notice-words"></div>
      <div class="chart tall" id="chart-words"></div>
      <div class="empty-state" id="empty-words"></div>
    </div>

  </section>
</main>

<script src="static/js/api.js"></script>
<script src="static/js/charts.js"></script>
<script>
/* 页面装配：先渲染骨架、再并发拉数据——五个接口互不依赖，串行等会让首屏慢 5 倍。 */

/** 渲染数据源切换按钮。计数来自 /api/stats/sources——让"双数据源各有多少条"在界面上可见。 */
async function renderSwitcher() {
  const box = document.getElementById('source-switcher');
  const active = currentSource();

  let counts = {};
  try {
    const data = await apiGet('/api/stats/sources');
    for (const s of data.sources) counts[s.source] = s.product_count;
  } catch (err) {
    // 拿不到计数不影响切换功能，按钮上不显示数字即可；不弹错误框（接口本身还能用）。
    console.warn('数据源清单加载失败，切换按钮将不显示计数', err);
  }

  box.innerHTML = '';
  for (const s of SOURCES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-pressed', String(s.id === active));
    // "全部"的计数规则只在 api.js 的 sourceCount 一处（原先四页各写一遍、表现不一）。
    const n = sourceCount(s.id, counts);
    btn.innerHTML = n === undefined
      ? s.label
      : `${s.label}<span class="count">${n === 0 ? '空' : n}</span>`;
    // 空数据源不置灰禁用——点进去看到空态提示，本身就是演示的一部分
    if (n === 0) btn.classList.add('empty');

    btn.onclick = () => {
      if (s.id === currentSource()) return;
      setSource(s.id);
      location.reload();
    };
    box.appendChild(btn);
  }
}

function renderCards(ov) {
  const box = document.getElementById('cards');
  const price = ov.price;

  const items = [
    { label: '商品数', value: fmtInt(ov.product_count),
      sub: ov.price_missing ? `${ov.price_missing} 个无价格` : '全部有价格' },
    { label: '店铺数', value: fmtInt(ov.shop_count), sub: '按店铺字段去重' },
    { label: '价格点', value: fmtInt(ov.price_point_count),
      sub: ov.product_count
        ? `均 ${(ov.price_point_count / ov.product_count).toFixed(1)} 点/商品` : '—' },
    { label: '价格中位数', value: price ? fmtPrice(price.median) : '—',
      sub: price ? `${fmtPrice(price.min)} ~ ${fmtPrice(price.max)}` : '无数据' },
    // 销量是"数据源差异"最直观的体现：Mock 有、真实采集没有。空着 + 说明，而不是显示 0——
    // 显示 0 会被读成"一件都没卖出去"，那是完全不同的事实。
    ov.has_sales
      ? { label: '销量合计', value: fmtInt(ov.sales.total),
          sub: `最高单品 ${fmtInt(ov.sales.max)}` }
      : { label: '销量合计', value: '—', sub: '真实电商不公开销量' },
  ];

  box.innerHTML = items.map((it) => `
    <div class="card">
      <div class="label">${it.label}</div>
      <div class="value">${it.value}</div>
      <div class="sub">${it.sub}</div>
    </div>`).join('');
}

/** 并发拉取 4 张图的数据：Promise.all 并发（串行会让首屏等于四者之和）；
 *  但每个各自 catch——任一失败只显示自己的空态，不让整页白屏。 */
async function loadCharts() {
  const jobs = [
    ['/api/stats/price-distribution', renderPriceDistribution,
     'chart-price', 'empty-price', 'notice-price'],
    ['/api/stats/sales-top', renderSalesTop,
     'chart-sales', 'empty-sales', 'notice-sales'],
    ['/api/stats/shop-share', renderShopShare,
     'chart-shop', 'empty-shop', 'notice-shop'],
    ['/api/stats/keywords', renderKeywords,
     'chart-words', 'empty-words', 'notice-words'],
  ];

  await Promise.all(jobs.map(async ([path, render, chartId, emptyId, noticeId]) => {
    try {
      const data = await apiGet(path);
      render(chartId, emptyId, noticeId, data);
    } catch (err) {
      console.error(path, err);
      toggleEmpty(chartId, emptyId, true, `接口请求失败：${err.message}`);
    }
  }));
}

(async function main() {
  // 切换按钮先画出来，它不依赖统计接口
  renderSwitcher();

  try {
    const ov = await apiGet('/api/stats/overview');
    renderCards(ov);
    showNotice('global-notice', ov.notice);
  } catch (err) {
    // err.message 也要转义：api.js 会把后端 detail 原样带过来（FastAPI 422 里含请求原值），
    // 来源不是我们自己写的句子。
    document.getElementById('cards').innerHTML =
      `<div class="card"><div class="label">加载失败</div>
       <div class="value">—</div><div class="sub">${escapeHtml(err.message)}</div></div>`;
  }

  await loadCharts();
})();
</script>
</body>
</html>
