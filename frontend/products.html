<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商竞品情报分析平台 · 商品列表</title>
<link rel="stylesheet" href="static/css/style.css">

<!-- 和 index.html 同一套 ECharts + 本地兜底，理由见那边的注释 -->
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<script>
  window.echarts || document.write('<script src="vendor/echarts.min.js"><\/script>');
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">电商竞品情报分析<span>数据管道演示</span></div>
    <div class="switcher" id="source-switcher" role="group" aria-label="数据源"></div>
    <nav class="pages">
      <a href="index.html">总览</a>
      <a href="products.html" class="active">商品列表</a>
      <a href="analysis.html">AI 分析</a>
      <a href="alerts.html">价格告警</a>
    </nav>
  </div>
</header>

<main>
  <div class="panel">
    <h2>商品列表</h2>
    <div class="hint">
      点任意一行查看详情和价格历史。
      「价格点」这一列是双数据源的直观对比：Mock 商品有 90 个点，
      真实采集的商品可能只有 1 个（只被爆料过一次）。
      缩略图只有真实采集的数据才有（Mock 没有配图），
      而且要经后端代理才能取回——理由见 <code>app/api/images.py</code>。
    </div>

    <div class="notice" id="page-notice"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题（支持中文）" autocomplete="off">
      <select id="sort">
        <option value="last_crawled_at">按采集时间</option>
        <option value="price">按价格</option>
        <option value="sales">按销量</option>
        <option value="id">按 ID</option>
      </select>
      <select id="order">
        <option value="desc">从高到低</option>
        <option value="asc">从低到高</option>
      </select>
      <span class="muted" id="total-hint"></span>
    </div>

    <div class="table-scroll">
      <table class="data">
        <thead>
          <tr>
            <!-- 缩略图列。★ 表头留空：这一列的内容（一张图或一块灰）
                 不需要标题，写个"图"只是噪声。宽度靠 th 上的 style 定，
                 不靠图片自己撑——图还没加载出来时列宽不能跳。 -->
            <th style="width:52px"></th>
            <th style="width:56px">ID</th>
            <th>标题</th>
            <th style="width:78px">来源</th>
            <th style="width:150px">品牌</th>
            <th style="width:92px" class="num">价格</th>
            <th style="width:92px" class="num">销量</th>
            <th style="width:150px">店铺</th>
            <th style="width:72px" class="num">价格点</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pager">
      <button id="prev">← 上一页</button>
      <span class="muted" id="page-info"></span>
      <button id="next">下一页 →</button>
    </div>
  </div>
</main>

<!-- 详情弹窗 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="m-title">—</h3>
        <div class="muted" id="m-sub"></div>
      </div>
      <button class="close" id="m-close" aria-label="关闭">✕</button>
    </div>

    <div class="notice" id="m-notice"></div>
    <!-- 详情主图。★ 没有图时这里是空的、不占位置（不是一块灰），
         因为弹窗是"看这一个商品"的地方，一块灰在这里只是噪声。 -->
    <div id="m-figure"></div>
    <div class="kv" id="m-kv"></div>
    <div class="chart" id="m-chart" style="height:300px"></div>

    <!-- 「为这个商品配告警」的入口。
         ★ 放这里而不是放列表行里：行本身就是"点开详情"的按钮，
           在里面再塞一个按钮要处理冒泡，而且 20 行各一个按钮也很吵。
           而"我正在看这个商品的详情"恰好是想给它配告警的那一刻。 -->
    <div class="modal-actions" id="m-actions"></div>
  </div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/charts.js"></script>
<script>
/* ============================================================================
 * 商品列表页
 * ========================================================================== */

// 页面状态。★ 集中放一个对象里，而不是散在几个全局变量：
//   每次请求都要把「当前页 + 搜索词 + 排序」一起带上，
//   散着放最容易出现"改了排序但翻页时用的还是旧排序"这类不同步的 bug。
const state = { page: 1, size: 20, q: '', sort: 'last_crawled_at', order: 'desc' };

/* 表格有几列，**从表头数出来**，不写死。
 *
 * ★ 空态和错误态那两行是 `colspan="N"`，N 写错的话：
 *     写小了 → 内容不居中，看起来只是"有点歪"
 *     写大了 → 多出来的格子把表撑宽，整页出现横向滚动条
 *   两种都不报错。而"加一列"是这一页最容易发生、也最容易忘的改动
 *   （加缩略图这一列时就刚刚发生过一次）。
 *   数出来就没有这个类别的问题了。
 */
const COL_COUNT = document.querySelectorAll('thead th').length;

async function renderSwitcher() {
  const box = document.getElementById('source-switcher');
  const active = currentSource();
  let counts = {};
  try {
    const data = await apiGet('/api/stats/sources');
    for (const s of data.sources) counts[s.source] = s.product_count;
  } catch (err) { console.warn('数据源清单加载失败', err); }

  box.innerHTML = '';
  for (const s of SOURCES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-pressed', String(s.id === active));
    // ★ 「全部」的计数怎么来，规则在 api.js 的 sourceCount 一处。
    //   原本这里自己求和、另外两页写 counts['all']（恒 undefined），
    //   于是「全部」按钮在不同页面上长得不一样。
    const n = sourceCount(s.id, counts);
    btn.innerHTML = n === undefined
      ? s.label
      : `${s.label}<span class="count">${n === 0 ? '空' : n}</span>`;
    if (n === 0) btn.classList.add('empty');
    btn.onclick = () => {
      if (s.id === currentSource()) return;
      setSource(s.id);
      state.page = 1;
      load();
    };
    box.appendChild(btn);
  }
}

function rowHtml(p) {
  // ★ 销量为空时显示"—"而不是 0。
  //   0 是"一件没卖出去"，"—"是"不知道"——两件完全不同的事，
  //   而真实采集的数据永远是后者。
  const sales = p.sales === null ? '<span class="muted">—</span>' : fmtInt(p.sales);

  // ★ 价格区间（券后 199-299 这种）在列表里也要能看出来。
  //   只在真的存在区间时才显示第二个数字，单值时保持表格干净。
  const hasRange = p.price_max !== null && p.price_max !== p.price;
  const price = p.price === null
    ? '<span class="muted">—</span>'
    : fmtPrice(p.price) + (hasRange ? `<span class="muted"> ~${fmtPrice(p.price_max)}</span>` : '');

  // ★ 没有图时给一块**空占位**，不给破图图标，也不给"暂无图片"四个字。
  //   因为"没有图"在这个列表里是常态（Mock 一条图都没有），
  //   而一个每行都出现的提示词，会盖过真正有图的那几行。
  const thumb = p.image_url
    ? `<img class="thumb" src="${proxyImageUrl(p.image_url)}" alt="" loading="lazy"
            onerror="imgFallback(this)">`
    : '<span class="thumb thumb-empty"></span>';

  return `
    <tr data-id="${p.id}">
      <td>${thumb}</td>
      <td class="muted">${p.id}</td>
      <td class="title-cell" title="${escapeAttr(p.title)}">${escapeHtml(p.title)}</td>
      <td><span class="tag src-${p.source}">${p.source}</span></td>
      <td>${p.brand ? escapeHtml(p.brand) : '<span class="muted">—</span>'}</td>
      <td class="num">${price}</td>
      <td class="num">${sales}</td>
      <td>${p.shop ? escapeHtml(p.shop) : '<span class="muted">未采集</span>'}</td>
      <td class="num">${p.price_point_count}</td>
    </tr>`;
}

/* ★ escapeHtml / escapeAttr 已经搬到 static/js/api.js 了。
 *
 *   搬家的理由不是"整理文件"，而是：**charts.js 也需要它，但拿不到。**
 *   本页的表格可以用 textContent 逐个建节点，而 ECharts 的 tooltip
 *   formatter 只能返回字符串、由 echarts 内部赋给 innerHTML——
 *   那条路上页面的转义纪律覆盖不到，只能由喂进去的字符串自己负责。
 *   放在 api.js（三个页面都引）才不会出现第二份拷贝。
 */

/* ★ 请求序号：只认**最后发出**的那一次的结果。
 *
 *   这一页有四个地方会调 load()（翻页、排序、每页条数、搜索），
 *   而它们全是异步的。连点两下「下一页」会发出两个请求，
 *   **哪个先回来是不确定的**——先发的完全可能后到。
 *
 *   没有这个序号时的表现：表格里是第 2 页的数据，
 *   而 `state.page` 已经是 3、「第 N / M 页」那行也写着 3。
 *   下一步再点「下一页」就跳过了第 3 页——**静默丢页**，
 *   而且因为页码看起来是连着的，根本不会想到是竞态。
 *
 *   后端的排序是确定的（见 app/api/stats.py 顶部第 2 条），
 *   所以这里只要把"该听谁的"定下来就够了。
 */
let _loadSeq = 0;

async function load() {
  const tbody = document.getElementById('rows');
  const seq = ++_loadSeq;
  try {
    const data = await apiGet('/api/products', {
      page: state.page, size: state.size, sort: state.sort, order: state.order, q: state.q,
    });

    // 已经有更新的请求发出去了 → 这份结果过期，整个丢掉。
    // ★ 必须连错误分支一起挡：否则一个失败的老请求会把
    //   新请求刚画好的表格替换成一行报错。
    if (seq !== _loadSeq) return;

    // ★ 页码翻过头了就拉回来。
    //   「下一页」按钮要等响应回来才会被禁用，而在等待的这段时间里
    //   每一次点击都已经把 state.page 加过一了——连点几下就会跑到
    //   数据的页数之外。后端**不夹页码**（见 app/api/products.py：
    //   直接 offset((page-1)*size)，page 原样回显），于是返回 items: []，
    //   界面显示"该数据源暂无商品"——可库里明明有 1100 条。
    //   真实原因是"你翻过头了"，和"没有数据"是完全不同的两件事。
    if (data.page > data.pages) {
      state.page = data.pages;
      // 这一次的结果由下面那个新请求接管（它的序号更新，会更靠后生效）
      load();
      return;
    }

    tbody.innerHTML = data.items.length
      ? data.items.map(rowHtml).join('')
      : `<tr><td colspan="${COL_COUNT}" style="text-align:center;padding:40px" class="muted">
           ${state.q ? '没有匹配的商品' : '该数据源暂无商品'}
         </td></tr>`;

    // 行点击 → 打开详情
    for (const tr of tbody.querySelectorAll('tr[data-id]')) {
      tr.onclick = () => openDetail(tr.dataset.id);
    }

    document.getElementById('total-hint').textContent = `共 ${fmtInt(data.total)} 条`;
    document.getElementById('page-info').textContent = `第 ${data.page} / ${data.pages} 页`;
    document.getElementById('prev').disabled = data.page <= 1;
    document.getElementById('next').disabled = data.page >= data.pages;

    // 空数据源的整体提示（和后端 NO_DATA_NOTICE 一致）
    showNotice('page-notice', data.total === 0 && !state.q
      ? '该数据源暂无商品。' : null);
  } catch (err) {
    // ★ 过期请求的错误也要丢掉。不挡的话，一个失败的老请求
    //   会把新请求刚画好的表格替换成一行报错——而且报的还是上一页的错。
    if (seq !== _loadSeq) return;
    console.error(err);
    tbody.innerHTML = `<tr><td colspan="${COL_COUNT}" style="text-align:center;padding:40px">
        接口请求失败：${escapeHtml(err.message)}</td></tr>`;
  }
}

/* ---------------------------------------------------------------------------
 * 详情弹窗
 * ------------------------------------------------------------------------ */

async function openDetail(id) {
  const modal = document.getElementById('modal');
  // ★ 先显示弹窗再画图。反过来的话 ECharts 会在一个 display:none
  //   的容器上初始化，量到的宽高是 0，图画不出来——而且不报错，
  //   表现为"点开是一块空白"，非常难查。
  modal.classList.add('show');

  const chartEl = document.getElementById('m-chart');
  const existing = echarts.getInstanceByDom(chartEl);
  if (existing) existing.resize();

  try {
    const [p, hist] = await Promise.all([
      apiGet(`/api/products/${id}`),
      apiGet(`/api/products/${id}/price-history`),
    ]);

    document.getElementById('m-title').textContent = p.title;
    document.getElementById('m-sub').innerHTML =
      `<span class="tag src-${p.source}">${p.source}</span>
       <span class="muted"> · ${escapeHtml(p.source_channel)} 通道 · 源站 ID ${escapeHtml(p.source_id)}</span>`;

    const kv = [
      ['当前价', p.price === null ? '—' : fmtPrice(p.price)],
      ['价格区间上限', p.price_max === null ? '—' : fmtPrice(p.price_max)],
      // ★ 历史极值来自 price_history 现算，不是 products.price_max。
      //   两者含义不同：price_max 是"这一次成交的区间上限"。
      ['历史最低 / 最高',
        p.historical_min === null ? '—' : `${fmtPrice(p.historical_min)} / ${fmtPrice(p.historical_max)}`],
      ['品牌 / 分类', `${p.brand || '—'} / ${p.category || '—'}`],
      ['店铺', p.shop || '未采集'],
      ['销量', p.sales === null ? '— （该数据源不提供）' : fmtInt(p.sales)],
      ['价格点数', String(p.price_point_count)],
      ['最近采集', fmtTime(p.last_crawled_at)],
      ['疑似重复指向', p.suspected_duplicate_of === null ? '无' : `#${p.suspected_duplicate_of}`],
      ['归一化标题', p.title_norm],
    ];
    document.getElementById('m-kv').innerHTML = kv.map(([k, v]) => `
      <div><div class="k">${k}</div><div>${escapeHtml(v)}</div></div>`).join('');

    // ★ 详情接口返回的 notice 直接显示——它解释的是"为什么只有一个点"，
    //   那正是"事件归并"这条叙事的关键一环，不能让它看起来像 bug。
    showNotice('m-notice', hist.notice, hist.notice ? 'info' : 'warn');

    renderPriceHistory('m-chart', hist);

    /* 主图。
     * ★ 走代理而不是直接 <img src="https://y.zdmimg.com/...">，理由见
     *   app/api/images.py 顶部（防盗链 / 不把访客 IP 送给图床 / 一处收口）。
     * ★ 用 createElement 而不是拼 innerHTML：这样能挂 onerror。
     *   失败就**整个撤掉**，不留破图——详情弹窗里一个破图图标
     *   比没有图难看得多，而失败是会发生的（断网、图床挂了、超过大小上限）。
     */
    const figure = document.getElementById('m-figure');
    figure.innerHTML = '';
    if (p.image_url) {
      const img = document.createElement('img');
      img.src = proxyImageUrl(p.image_url);
      // ★ 详情页的主图是**内容**，不是装饰，所以 alt 必须写标题。
      //   列表里的缩略图可以 alt=""（标题就在旁边），这里不行。
      img.alt = p.title;
      img.onerror = () => { figure.innerHTML = ''; };
      figure.appendChild(img);
    }

    // 弹窗底部两个动作：去看原帖、给这个商品配告警。
    const actions = document.getElementById('m-actions');
    actions.innerHTML = '';

    // 带商品 id 跳到告警页。★ 用 URL 参数而不是 localStorage：
    //   这是"我要给这一个商品配告警"的一次性上下文，
    //   像数据源那样长期记住它反而会让下次进来时莫名其妙地预选一个商品。
    const alertLink = document.createElement('a');
    alertLink.className = 'btn primary';
    alertLink.href = 'alerts.html?product_id=' + encodeURIComponent(id);
    alertLink.textContent = '为这个商品配价格告警 →';
    actions.appendChild(alertLink);

    // 回源站看原帖。
    // ★ rel="noopener" 不能省：不带它的话，被打开的那个页面可以
    //   通过 window.opener 把我们这一页导航走（反向 tabnabbing）——
    //   而这里打开的恰好是一个**外部站点**。
    //   noreferrer 是顺手：既然这个项目在意"不把访客信息送给第三方"，
    //   那就别在这里漏一个 Referer 出去。
    if (p.url) {
      const srcLink = document.createElement('a');
      srcLink.className = 'btn';
      srcLink.href = p.url;
      srcLink.target = '_blank';
      srcLink.rel = 'noopener noreferrer';
      srcLink.textContent = '查看原爆料 ↗';
      srcLink.style.marginLeft = '8px';
      actions.appendChild(srcLink);
    }
  } catch (err) {
    console.error(err);
    document.getElementById('m-title').textContent = '加载失败';
    showNotice('m-notice', err.message);
  }
}

function closeDetail() {
  document.getElementById('modal').classList.remove('show');
}

/* ---------------------------------------------------------------------------
 * 事件绑定
 * ------------------------------------------------------------------------ */

document.getElementById('m-close').onclick = closeDetail;
// 点背景关闭。★ 必须判断 e.target 就是背景本身，
//   否则点弹窗内部任何地方都会把弹窗关掉。
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') closeDetail();
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

document.getElementById('prev').onclick = () => { state.page -= 1; load(); };
document.getElementById('next').onclick = () => { state.page += 1; load(); };
document.getElementById('sort').onchange = (e) => {
  state.sort = e.target.value; state.page = 1; load();
};
document.getElementById('order').onchange = (e) => {
  state.order = e.target.value; state.page = 1; load();
};

/* 搜索防抖。
 *
 * ★ 不防抖的话，输入"充电宝"三个字会发三次请求，
 *   而且三次的响应**可能乱序返回**——最后显示的是哪一次的结果
 *   取决于网络快慢，于是搜索结果看起来是随机的。
 *   300ms 是打字停顿的常见经验值：比它短会在连续输入时误触发，
 *   比它长会有明显的卡顿感。
 */
let searchTimer = null;
document.getElementById('q').oninput = (e) => {
  clearTimeout(searchTimer);
  const value = e.target.value.trim();
  searchTimer = setTimeout(() => {
    state.q = value;
    state.page = 1;
    load();
  }, 300);
};

(async function main() {
  renderSwitcher();
  await load();
})();
</script>
</body>
</html>
